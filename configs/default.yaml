model: "Qwen3-8B"
api_base_url: "http://localhost:8001/v1/chat/completions"
api_key: "dummy"

trace_generation:
  temperature: 0.7
  max_tokens: 16384
  max_concurrent: 8
  max_retries: 3
  timeout: 600

skill_distillation:
  temperature: 0.3
  max_tokens: 4096
  max_concurrent: 8
  max_retries: 3
  timeout: 300

inference:
  temperature: 0.0
  max_tokens: 8192
  max_concurrent: 8
  max_retries: 3
  timeout: 600
  top_k: 3
  no_think: true
  retrieval:
    min_score: 40.0
    top1_ratio: 1.5
    confidence_threshold: 50.0
    ratio_cutoff: 0.7

synthesis:
  temperature: 0.8
  max_tokens: 4096
  max_concurrent: 4
  num_problems_per_seed: 5
